services:
  backend-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lb-backend-1
    entrypoint: ["/usr/local/bin/backend"]
    command: ["-name", "backend-1", "9001"]
    expose:
      - "9001"
    restart: unless-stopped

  backend-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lb-backend-2
    entrypoint: ["/usr/local/bin/backend"]
    command: ["-name", "backend-2", "9002"]
    expose:
      - "9002"
    restart: unless-stopped

  backend-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lb-backend-3
    entrypoint: ["/usr/local/bin/backend"]
    command: ["-name", "backend-3", "9003"]
    expose:
      - "9003"
    restart: unless-stopped

  lb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: http-load-balancer
    command: ["-config", "/etc/lb/config.yaml"]
    volumes:
      - ./config.docker.yaml:/etc/lb/config.yaml:ro
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    restart: unless-stopped
