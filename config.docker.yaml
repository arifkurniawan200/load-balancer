listen: ":8080"
dashboard: ":8081"
strategy: least_conn # round_robin | least_conn | consistent_hash | weighted_round_robin
health_check:
  path: /health
  interval: 5s
  timeout: 2s
backends:
  - url: http://backend-1:9001
    weight: 1
  - url: http://backend-2:9002
    weight: 1
  - url: http://backend-3:9003
    weight: 1
